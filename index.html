<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#EDE5D3">
<title>个人博客</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<div class="progress" id="progress"></div>

<div class="paper">

  <header class="masthead">
    <div class="masthead-bg" aria-hidden="true">
      <div class="bg-slab"></div>
      <div class="bg-red"></div>
      <div class="bg-ray"></div>
      <div class="bg-rings"><i></i><i></i><i></i></div>
      <div class="bg-tri"></div>
      <div class="bg-dots"></div>
      <div class="bg-stripes"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="masthead-inner">
      <div class="kicker" id="siteKicker">ЛИЧНЫЙ БЛОГ · 个人博客</div>
      <h1 class="title">
        <span class="title-main" id="siteTitle">名前</span>
        <span class="title-ghost" id="siteTitleGhost" aria-hidden="true">名前</span>
      </h1>
      <div class="subtitle" id="siteSub">写点东西的地方</div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="切换配色">◐</button>
  </header>

  <nav class="nav">
    <a href="#list" id="navList" class="active">文章</a>
    <a href="#archive">归档</a>
    <a href="#about">关于</a>
    <span class="nav-rule"></span>
    <span class="nav-count" id="postCount">00</span>
    <button class="user-chip" id="userChip" type="button">登录</button>
  </nav>

  <main>
    <!-- ===== 列表 ===== -->
    <section id="list" class="section">
      <div class="section-head">
        <span class="num">01</span>
        <h2>СТАТЬИ / 文章</h2>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <span class="search-mark">◆</span>
          <input id="search" type="search" placeholder="搜索标题或正文…" autocomplete="off">
          <button class="search-clear" id="searchClear" hidden>×</button>
        </div>
        <div class="tags" id="tagBar"></div>
      </div>

      <div id="posts" class="posts"></div>
      <div class="empty" id="empty" hidden>没有匹配的文章。</div>
    </section>

    <!-- ===== 文章 ===== -->
    <section id="article" class="section article-view" hidden>
      <button class="back" id="backBtn">← 返回列表</button>
      <div class="article-meta">
        <span id="artAuthor" class="art-author"></span>
        <span class="dot">◆</span>
        <span id="artDate"></span>
        <span class="dot">◆</span>
        <span id="artRead"></span>
        <span class="dot">◆</span>
        <span id="artTags" class="art-tags"></span>
      </div>
      <h2 class="article-title" id="artTitle"></h2>
      <div class="art-stats" id="artStats" hidden>
        <button class="stat-like" id="likeBtn" type="button">
          <span class="stat-tri">▲</span><span id="likeCount">0</span>
        </button>
        <span class="stat-item">阅读 <b id="viewCount">0</b></span>
        <span class="stat-item">评论 <b id="commentCount">0</b></span>
      </div>

      <div class="article-layout">
        <aside class="toc" id="toc" hidden>
          <div class="toc-label">СОДЕРЖАНИЕ</div>
          <div class="toc-body" id="tocBody"></div>
        </aside>
        <div class="article-body" id="artBody"></div>
      </div>
      <div class="postnav" id="postnav"></div>
      <section class="comments" id="comments" hidden>
        <div class="section-head">
          <span class="num">◆</span>
          <h2>КОММЕНТАРИИ / 评论</h2>
        </div>
        <div class="comment-list" id="commentList"></div>
        <form class="comment-form" id="commentForm">
          <textarea id="commentBody" rows="3" maxlength="1000" placeholder="说点什么…"></textarea>
          <div class="comment-actions">
            <span class="comment-as" id="commentAs">登录后可以留言</span>
            <button type="submit" class="btn-red">发表</button>
          </div>
        </form>
      </section>

    </section>

    <!-- ===== 归档 ===== -->
    <section id="archive" class="section">
      <div class="section-head">
        <span class="num">02</span>
        <h2>АРХИВ / 归档</h2>
      </div>
      <div class="sortbar" id="sortBar">
        <button type="button" class="tag on" data-sort="date">按时间</button>
        <button type="button" class="tag" data-sort="author">按作者</button>
        <button type="button" class="tag" data-sort="likes">按点赞</button>
      </div>
      <div id="archiveBody" class="archive"></div>
    </section>

    <!-- ===== 关于 ===== -->
    <section id="about" class="section">
      <div class="section-head">
        <span class="num">03</span>
        <h2>О СЕБЕ / 关于</h2>
      </div>
      <div class="about-grid">
        <div class="about-block">
          <div class="block-label">КТО</div>
          <p id="aboutText"></p>
        </div>
        <div class="about-block">
          <div class="block-label">ЧТО</div>
          <p id="aboutWhat"></p>
        </div>
        <div class="about-block">
          <div class="block-label">ГДЕ</div>
          <p id="aboutWhere"></p>
        </div>
      </div>
    </section>

    <!-- ===== 账号 ===== -->
    <section id="account" class="section" hidden>
      <div class="section-head">
        <span class="num">04</span>
        <h2>АККАУНТ / 账号</h2>
      </div>

      <div class="auth-wrap">
        <div class="auth-tabs" id="authTabs">
          <button type="button" class="tag on" data-tab="login">登录</button>
          <button type="button" class="tag" data-tab="signup">注册</button>
        </div>

        <form class="auth-form" id="loginForm" autocomplete="on">
          <label class="field">
            <span>ИМЯ / 用户名</span>
            <input id="loginUser" type="text" autocomplete="username" required>
          </label>
          <label class="field">
            <span>ПАРОЛЬ / 密码</span>
            <input id="loginPass" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit" class="btn-red">登录</button>
          <p class="auth-msg" id="loginMsg"></p>
        </form>

        <form class="auth-form" id="signupForm" hidden>
          <label class="field">
            <span>ИМЯ / 用户名</span>
            <input id="suUser" type="text" maxlength="20" placeholder="2~20 个字" required>
          </label>
          <label class="field">
            <span>ПАРОЛЬ / 密码</span>
            <input id="suPass" type="password" placeholder="至少 6 位" required>
          </label>
          <label class="field">
            <span>ПОВТОР / 再输一次</span>
            <input id="suPass2" type="password" required>
          </label>
          <label class="field">
            <span>ТЕЛЕФОН / 电话</span>
            <input id="suPhone" type="tel" inputmode="numeric" placeholder="仅登记用，不对外显示" required>
          </label>
          <button type="submit" class="btn-red">注册</button>
          <p class="auth-msg" id="signupMsg"></p>
        </form>

        <div class="me-panel" id="mePanel" hidden>
          <div class="me-row">
            <span class="me-tag">ИМЯ</span>
            <b id="meName">—</b>
            <span class="me-role" id="meRole"></span>
          </div>
          <div class="me-row">
            <span class="me-tag">ТЕЛ</span>
            <span id="mePhone">—</span>
          </div>
          <form class="me-phone" id="phoneForm">
            <input id="mePhoneInput" type="tel" inputmode="numeric" placeholder="改电话">
            <button type="submit" class="tag">保存</button>
          </form>
          <p class="auth-msg" id="phoneMsg"></p>
          <button type="button" class="tag" id="logoutBtn">退出登录</button>
        </div>

        <p class="auth-note">注册需要用户名、密码和电话。电话只用来登记，不会公开显示，也不会收到短信。</p>
      </div>
    </section>

    <!-- ===== 后台 ===== -->
    <section id="admin" class="section" hidden>
      <div class="section-head">
        <span class="num">05</span>
        <h2>АДМИН / 后台</h2>
      </div>
      <div id="adminBody" class="admin-body"></div>
    </section>

  </main>

  <footer class="footer">
    <span class="red-block"></span>
    <span id="footerText">© 2026</span>
    <span class="footer-mark">◆</span>
  </footer>

</div>

<button class="totop" id="toTop" hidden aria-label="回到顶部">↑</button>

<script src="posts.js?v=5"></script>
<script src="account.js?v=5"></script>
<script src="social.js?v=5"></script>
<script src="admin.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
